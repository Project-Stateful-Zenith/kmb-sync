<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family="Roboto, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="252" rx="16" fill="#141218"/>
  <rect x="12" y="12" width="736" height="228" rx="12" fill="#211f26"/>
  <text x="32" y="46" fill="#e6e0e9" font-size="17">Link traffic per day</text>
  <text x="32" y="66" fill="#cac4d0" font-size="12.5">One meter with 12 LocalBus feeders, polled hourly</text>

  <line x1="248" y1="84" x2="248" y2="210" stroke="#49454f"/>

  <text x="32" y="104" fill="#e6e0e9" font-size="13">Data the meter produces</text>
  <rect x="248" y="92" width="5" height="18" rx="4" fill="#938f99"/>
  <text x="262" y="106" fill="#cac4d0" font-size="13" font-weight="500">6.5 MB</text>

  <text x="32" y="144" fill="#e6e0e9" font-size="13">Previous polling service</text>
  <text x="32" y="160" fill="#938f99" font-size="11.5">ENVIS.Online, measured</text>
  <rect x="248" y="132" width="476" height="18" rx="4" fill="#f2b8b5"/>
  <text x="712" y="146" fill="#601410" font-size="13" font-weight="500" text-anchor="end">670 MB</text>

  <text x="32" y="190" fill="#e6e0e9" font-size="13">kmb-sync, measured</text>
  <rect x="248" y="178" width="5" height="18" rx="4" fill="#6dd58c"/>
  <text x="262" y="192" fill="#e6e0e9" font-size="13" font-weight="500">6.8 MB</text>
  <rect x="314" y="177" width="104" height="20" rx="8" fill="#d0bcff"/>
  <text x="366" y="191" fill="#381e72" font-size="12" font-weight="500" text-anchor="middle">about 99 % less</text>

  <text x="32" y="226" fill="#938f99" font-size="11.5">Same records stored. The link of this station carries about 8 kB/s.</text>
</svg>
