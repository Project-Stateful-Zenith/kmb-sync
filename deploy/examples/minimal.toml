[service]
database = "/var/lib/kmb-sync/sync.db"
listen = "127.0.0.1:8650"
status_listen = "0.0.0.0:8651"
max_concurrency = 4
heartbeat = "5m"
describe_every = "6h"

[[device]]
name = "harbor-gate"
host = "198.51.100.14"
path = ["Demo", "Harbor Gate"]

[[job]]
name = "harbor-gate-archives"
device = "harbor-gate"
kind = "archive"
archives = ["Main", "Log", "Elmeter"]
every = "15m"
anchor = "2026-03-01T00:00:00Z"
timeout = "5m"
max_size = "2MiB"

[[job]]
device = "harbor-gate"
kind = "values"
set = "ActData"
every = "1m"
timeout = "20s"

[[job]]
device = "harbor-gate"
kind = "clock"
every = "1h"
timeout = "20s"
