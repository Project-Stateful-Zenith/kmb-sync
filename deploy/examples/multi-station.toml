[service]
database = "/var/lib/kmb-sync/sync.db"
listen = "127.0.0.1:8650"
status_listen = "0.0.0.0:8651"
max_concurrency = 3

[[device]]
name = "riverside-sub"
host = "198.51.100.22"
path = ["Network", "Riverside", "Riverside Substation"]

[[device]]
name = "ridge-wind"
host = "203.0.113.40"
path = ["Generation", "Ridge Wind Farm"]

[[device]]
name = "pump-station-7"
host = "198.51.100.73"
address = 2
path = ["Utilities", "Pump Station 7"]

[[job]]
name = "riverside-archives"
device = "riverside-sub"
kind = "archive"
archives = ["Main", "Log", "MainPQ", "Elmeter", "LB"]
every = "15m"
anchor = "2026-03-01T00:00:00Z"
timeout = "5m"
max_size = "3MiB"

[[job]]
name = "riverside-values"
device = "riverside-sub"
kind = "values"
set = "ActData"
every = "2m"
timeout = "20s"

[[job]]
name = "ridge-archives"
device = "ridge-wind"
kind = "archive"
archives = "all"
every = "1h"
anchor = "2026-03-01T00:10:00Z"
timeout = "10m"
max_size = "6MiB"
start_from = "2026-02-15T00:00:00Z"

[[job]]
name = "pump-archives"
device = "pump-station-7"
kind = "archive"
archives = ["Main", "Elmeter"]
every = "24h"
start_time = "03:15"
timeout = "30m"
max_size = "16MiB"

[[job]]
name = "riverside-clock"
device = "riverside-sub"
kind = "clock"
every = "4h"
timeout = "20s"
