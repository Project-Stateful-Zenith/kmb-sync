[service]
database = "/var/lib/kmb-sync/sync.db"
listen = "0.0.0.0:8650"
api_token_file = "/etc/kmb-sync/api-token"
status_listen = "0.0.0.0:8651"
status_api = true
status_api_token_file = "/etc/kmb-sync/status-api-token"
heartbeat = "1m"
describe_every = "12h"

[[device]]
name = "station-a"
host = "192.0.2.10"
path = ["Example", "Station A"]

[[job]]
device = "station-a"
kind = "archive"
archives = ["Main", "Elmeter"]
every = "15m"
max_size = "2MiB"
