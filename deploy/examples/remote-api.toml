[service]
database = "/var/lib/kmb-sync/sync.db"
listen = "0.0.0.0:8650"
api_token_file = "/etc/kmb-sync/api-token"
status_listen = "0.0.0.0:8651"
status_api = true
status_api_token_file = "/etc/kmb-sync/status-api-token"
heartbeat = "2m"
describe_every = "8h"

[[device]]
name = "office-tower"
host = "192.0.2.120"
path = ["Campus", "Office Tower"]

[[job]]
device = "office-tower"
kind = "archive"
archives = ["Main", "Elmeter"]
every = "15m"
max_size = "2MiB"
